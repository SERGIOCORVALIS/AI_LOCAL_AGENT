[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-agent"
version = "0.1.0"
description = "Windows-first local autonomous AI agent platform"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
  {name = "Pankov Sergey Vladimirovish"},
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "typer>=0.12,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8.0",
  "mypy>=1.11,<2.0",
  "pre-commit>=3.8,<4.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.6,<1.0",
]
integrations = [
  "aiogram>=3.13,<4.0",
  "playwright>=1.46,<2.0",
  "qdrant-client>=1.11,<2.0",
  "watchdog>=4.0,<5.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "services*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-q --cov=apps --cov=packages --cov=services --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 85
skip_empty = true
