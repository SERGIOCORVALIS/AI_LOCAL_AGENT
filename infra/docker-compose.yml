services:
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../.env
    environment:
      LOCAL_AI_AGENT_QDRANT_URL: http://qdrant:6333
      # Reach Ollama on the Windows host from inside the container.
      LOCAL_AI_AGENT_OLLAMA_URL: http://host.docker.internal:11434
      # Coding CLIs live in the dedicated sidecar (not on the API image PATH).
      LOCAL_AI_AGENT_CODING_AGENTS_URL: http://coding:8091
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../runtime:/app/runtime
      - ../backups:/app/backups
      # Writable host .env so admin Settings (PUT /settings) persist across restarts.
      - ../.env:/app/.env
    depends_on:
      qdrant:
        condition: service_healthy
      coding:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  coding:
    build:
      context: ..
      dockerfile: infra/coding.Dockerfile
    ports:
      - "127.0.0.1:8091:8091"
    env_file:
      - ../.env
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      LOCAL_AI_AGENT_OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Project root for coding-agent file edits.
      - ..:/workspace
      - ../runtime:/app/runtime
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      # Official image has no curl; use bash /dev/tcp + HTTP readyz check.
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -qi ready <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  qdrant_data:
