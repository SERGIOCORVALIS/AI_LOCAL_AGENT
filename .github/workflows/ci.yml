name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Lightweight integration packages for import/collection (skip heavy faster-whisper).
          pip install "aiogram>=3.13,<4.0" "playwright>=1.46,<2.0" "qdrant-client>=1.11,<2.0" "watchdog>=4.0,<5.0"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        run: pytest
